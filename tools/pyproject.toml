[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mmd"
version = "0.1.0"
description = "MultiMagicDungeon dev CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
mmd = "mmd.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mmd*"]
